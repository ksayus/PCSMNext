name: PCSMNext CI/CD

# ============================================================
# PCSMNext 自动构建工作流
# 项目: .NET 10 WPF 桌面应用
# 框架: net10.0-windows7.0 / net10.0
# 解决方案格式: .slnx (需要 .NET 10 SDK)
#
# 注意: 此 yml 文件应放在 PCSMNext 仓库的 .github/workflows/ 目录下
#       如果在其他仓库运行，checkout 会通过 repository 参数显式指定 PCSMNext
# ============================================================

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      configuration:
        description: '构建配置'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: ${{ inputs.configuration || 'Release' }}

jobs:
  # ============================================================
  # 构建 Job
  # ============================================================
  build:
    name: 构建 PCSMNext
    runs-on: windows-latest

    steps:
      # ----------------------------------------------------------
      # Step 1: 检出 PCSMNext 代码
      # 显式指定 repository 确保无论 workflow 在哪个仓库运行，
      # 都能正确检出 PCSMNext 到工作目录根路径
      # ----------------------------------------------------------
      - name: 检出 PCSMNext 代码
        uses: actions/checkout@v4
        with:
          repository: ksayus/PCSMNext
          fetch-depth: 0

      # ----------------------------------------------------------
      # Step 2: 安装 .NET 10 SDK
      # ----------------------------------------------------------
      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ----------------------------------------------------------
      # Step 3: 验证环境
      # ----------------------------------------------------------
      - name: 显示 .NET 版本和文件结构
        run: |
          dotnet --version
          dotnet --list-sdks
          echo "=== 列出工作目录根路径 ==="
          dir
          echo "=== 验证 .slnx 文件 ==="
          dir PCSMNext.slnx
          echo "=== 验证项目目录 ==="
          dir PCSMNext.App\PCSMNext.App.csproj
          dir PCSMNext.Core\PCSMNext.Core.csproj
          dir PCSMNext.Services\PCSMNext.Services.csproj

      # ----------------------------------------------------------
      # Step 4: 克隆 LivelyAnimationEngine 依赖仓库
      # .slnx 中引用路径: LivelyAnimationEngine/LivelyAnimationEngine.csproj
      # 克隆后验证:   LivelyAnimationEngine/LAE/LivelyAnimationEngine.csproj
      # 注意路径差异 — .slnx 写的路径可能和实际目录结构不匹配
      # ----------------------------------------------------------
      - name: 克隆 LivelyAnimationEngine
        run: |
          git clone https://github.com/ksayus/LivelyAnimationEngine.git
          echo "=== 验证 LAE 目录结构 ==="
          dir LivelyAnimationEngine
          dir LivelyAnimationEngine\LAE
          dir LivelyAnimationEngine\LAE\LivelyAnimationEngine.csproj

      # ----------------------------------------------------------
      # Step 5: 还原 NuGet 包
      # 优先使用 .slnx 还原；失败则逐个项目还原
      # ----------------------------------------------------------
      - name: 还原 NuGet 包 (.slnx)
        run: dotnet restore PCSMNext.slnx
        continue-on-error: true

      - name: 还原 NuGet 包 (逐个项目)
        if: failure()
        run: |
          echo "=== .slnx restore 失败，回退到逐个项目 restore ==="
          dotnet restore PCSMNext.Core\PCSMNext.Core.csproj
          dotnet restore PCSMNext.Services\PCSMNext.Services.csproj
          dotnet restore LivelyAnimationEngine\LAE\LivelyAnimationEngine.csproj
          dotnet restore PCSMNext.App\PCSMNext.App.csproj

      # ----------------------------------------------------------
      # Step 6: 构建项目
      # 优先使用 .slnx 构建；失败则逐个项目构建
      # ----------------------------------------------------------
      - name: 构建项目 (.slnx)
        run: >
          dotnet build PCSMNext.slnx
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore

      - name: 构建项目 (逐个项目)
        if: failure()
        run: |
          echo "=== .slnx build 失败，回退到逐个项目 build ==="
          dotnet build PCSMNext.Core\PCSMNext.Core.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
          dotnet build PCSMNext.Services\PCSMNext.Services.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
          dotnet build LivelyAnimationEngine\LAE\LivelyAnimationEngine.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
          dotnet build PCSMNext.App\PCSMNext.App.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      # ----------------------------------------------------------
      # Step 7: 发布 App (生成单文件应用)
      # ----------------------------------------------------------
      - name: 发布应用
        run: >
          dotnet publish PCSMNext.App\PCSMNext.App.csproj
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --output publish
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      # ----------------------------------------------------------
      # Step 8: 上传构建产物
      # ----------------------------------------------------------
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PCSMNext-${{ env.BUILD_CONFIGURATION }}
          path: publish/
          retention-days: 30

  # ============================================================
  # 可选: 创建 Release
  # 仅在推送 tag 时触发，如 v1.0.0
  # ============================================================
  release:
    name: 创建 Release
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: PCSMNext-Release
          path: publish/

      - name: 打包为 ZIP
        run: |
          Compress-Archive -Path publish\* -DestinationPath PCSMNext.zip

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PCSMNext.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
